<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>波希米亚狂想曲的九九八十一种听法</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Bohemian Rhapsody</h1>
      <p class="subtitle">—— 九九八十一种听法</p>
    </header>

    <!-- 音频上传/选择区域 -->
    <div class="audio-control-card">
      <input type="file" id="audioUpload" accept="audio/*" />
      <button id="playBtn" disabled>请先选择音频</button>
      <div id="statusText">当前听法：[0, 0] 原始原声</div>
    </div>

    <!-- 9x9 交互矩阵容器 -->
    <div class="matrix-wrapper">
      <div class="axis-label x-axis-label">空间与介质 ➔</div>
      <div id="matrix" class="matrix-grid"></div>
      <div class="axis-label y-axis-label">时间与形态 ➔</div>
    </div>
  </div>

  <script src="js/audio-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
